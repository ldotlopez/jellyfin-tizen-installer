name: Publish to GHCR

on:
  push:
    tags:
      - "v*-r*"

# Required permissions to push to GHCR
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract tag name
        id: vars
        run: |
          set -euo pipefail

          FULL_TAG="${GITHUB_REF#refs/tags/}"
          if [[ ! "${FULL_TAG}" =~ ^v[0-9]+(\.[0-9]+)+-r[0-9]{3}$ ]]; then
            echo "Invalid release tag '${FULL_TAG}'. Expected v<Jellyfin version>-r<project revision>." >&2
            exit 1
          fi

          JELLYFIN_TAG="${FULL_TAG%-*}"

          echo "repo_tag=${FULL_TAG}" >> "$GITHUB_OUTPUT"
          echo "jellyfin_tag=${JELLYFIN_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: docker
          build-args: |
            JELLYFIN_TAG=${{ steps.vars.outputs.jellyfin_tag }}
          #   # JELLYFIN_BRANCH=release-10.11.z
          #   SOME_OTHER_VAR=hello-world
          push: true
          # Note: repository name is converted to lowercase for GHCR compatibility
          tags: |
            ghcr.io/${{ github.repository_owner }}/jellyfin-tizen-installer:${{ steps.vars.outputs.repo_tag }}
            ghcr.io/${{ github.repository_owner }}/jellyfin-tizen-installer:latest
